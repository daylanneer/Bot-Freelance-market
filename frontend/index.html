<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOT Freelance Market</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0f1a;--card:#111827;--card2:#1a2235;--border:#1e3a5f;--accent:#3b82f6;--accent2:#60a5fa;--accent-glow:rgba(59,130,246,0.15);--text:#e2e8f0;--text2:#94a3b8;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--purple:#a78bfa}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{background:linear-gradient(135deg,#0f172a,#1e293b);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;-webkit-text-fill-color:white}
.mode-toggle{display:flex;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.mode-btn{padding:8px 18px;cursor:pointer;font-size:13px;color:var(--text2);border:none;background:transparent;transition:all .3s}
.mode-btn.active{background:var(--accent);color:#fff;font-weight:600}
.wallet-btn{padding:10px 24px;border-radius:12px;border:1px solid var(--accent);background:var(--accent-glow);color:var(--accent2);cursor:pointer;font-size:14px;font-weight:600;transition:all .3s}
.wallet-btn:hover{background:var(--accent);color:#fff}
.wallet-btn.connected{border-color:var(--green);color:var(--green);background:rgba(34,197,94,0.1)}
.container{max-width:1200px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.stat-label{color:var(--text2);font-size:13px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.stat-value{font-size:28px;font-weight:700;color:var(--text)}
.section-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px}
.create-form{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:32px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:13px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.form-group input,.form-group textarea{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:14px;outline:none;transition:border .3s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent)}
.form-group textarea{resize:vertical;min-height:80px}
.submit-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),#2563eb);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .2s,box-shadow .2s;margin-top:8px}
.submit-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,0.3)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.jobs-grid{display:grid;gap:16px;margin-bottom:32px}
.job-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;transition:border-color .3s}
.job-card:hover{border-color:var(--accent)}
.job-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.job-title{font-size:17px;font-weight:700}
.job-budget{font-size:18px;font-weight:700;color:var(--accent2)}
.job-desc{color:var(--text2);font-size:14px;margin-bottom:16px;line-height:1.5}
.job-meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.job-status{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;text-transform:uppercase}
.status-open{background:rgba(34,197,94,0.15);color:var(--green)}
.status-progress{background:rgba(59,130,246,0.15);color:var(--accent2)}
.status-completed{background:rgba(167,139,250,0.15);color:var(--purple)}
.status-disputed{background:rgba(239,68,68,0.15);color:var(--red)}
.status-cancelled{background:rgba(148,163,184,0.15);color:var(--text2)}
.job-addr{font-size:12px;color:var(--text2);font-family:monospace}
.job-actions{display:flex;gap:8px;margin-top:16px}
.action-btn{padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:13px;cursor:pointer;font-weight:600;transition:all .3s}
.action-btn:hover{border-color:var(--accent);color:var(--accent2)}
.action-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.action-btn.danger{border-color:var(--red);color:var(--red)}
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--card);border-radius:12px;padding:4px;border:1px solid var(--border)}
.tab{padding:10px 20px;border-radius:10px;cursor:pointer;font-size:14px;color:var(--text2);transition:all .3s;border:none;background:transparent;font-weight:500}
.tab.active{background:var(--accent);color:#fff;font-weight:600}
.empty-state{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.toast{position:fixed;bottom:24px;right:24px;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;animation:slideIn .3s ease}
.toast.success{background:var(--green);color:#fff}
.toast.error{background:var(--red);color:#fff}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
@media(max-width:768px){.stats{grid-template-columns:repeat(2,1fr)}.form-row{grid-template-columns:1fr}.topbar{padding:12px 16px;flex-wrap:wrap;gap:12px}}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.9.0/ethers.umd.min.js"></script>
<div class="topbar">
  <div class="logo"><div class="logo-icon">💼</div>BOT Freelance Market</div>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('demo')">Demo Mode</button>
    <button class="mode-btn" onclick="setMode('live')">Live Blockchain</button>
  </div>
  <button class="wallet-btn" id="walletBtn" onclick="connectWallet()">Connect Wallet</button>
</div>
<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="stat-label">Total Jobs</div><div class="stat-value" id="totalJobs">0</div></div>
    <div class="stat-card"><div class="stat-label">Jobs Completed</div><div class="stat-value" id="completedJobs">0</div></div>
    <div class="stat-card"><div class="stat-label">Value Locked</div><div class="stat-value" id="valueLocked">0 BOT</div></div>
    <div class="stat-card"><div class="stat-label">Platform Fee</div><div class="stat-value" id="platformFee">2.5%</div></div>
  </div>
  <div class="section-title">📝 Post a Job</div>
  <div class="create-form">
    <div class="form-row">
      <div class="form-group"><label>Job Title</label><input id="jobTitle" placeholder="e.g. Build a DApp frontend"></div>
      <div class="form-group"><label>Budget (BOT)</label><input id="jobBudget" type="number" step="0.01" placeholder="1.0"></div>
    </div>
    <div class="form-group full" style="margin-bottom:16px"><label>Description</label><textarea id="jobDesc" placeholder="Describe the work needed..."></textarea></div>
    <button class="submit-btn" id="postBtn" onclick="postJob()" disabled>Post Job</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('all')">All Jobs</button>
    <button class="tab" onclick="switchTab('my-client')">My Posted Jobs</button>
    <button class="tab" onclick="switchTab('my-freelancer')">My Freelance Jobs</button>
  </div>
  <div class="jobs-grid" id="jobsList"></div>
</div>
<script>
const BOT_CHAIN = {
  // ⚠️ Currently set to TESTNET. Before deploying to mainnet, change to:
  // chainId: "0x2A5", chainName: "BOT Chain", rpcUrls: ["https://rpc.botchain.ai"], blockExplorerUrls: ["https://scan.botchain.ai/"]
  chainId: "0x3C8", // 968 in hex (testnet)
  chainName: "BOT Chain Testnet",
  nativeCurrency: { name: "BOT", symbol: "BOT", decimals: 18 },
  rpcUrls: ["https://rpc.bohr.life"],
  blockExplorerUrls: ["https://scan.bohr.life/"]
};
const CONTRACT_ADDRESS="0x0000000000000000000000000000000000000000";
const ABI=[
  "function createJob(string _title, string _description) external payable",
  "function acceptJob(uint256 _jobId) external",
  "function approveWork(uint256 _jobId) external",
  "function cancelJob(uint256 _jobId) external",
  "function raiseDispute(uint256 _jobId) external",
  "function getJob(uint256 _jobId) external view returns (tuple(address client,address freelancer,string title,string description,uint256 budget,uint8 status,uint256 createdAt,uint256 completedAt))",
  "function getJobCount() external view returns (uint256)"
];
let mode='demo',connected=false,account=null,demoJobs=[],demoBalance=50,currentTab='all';
let provider=null,signer=null,contract=null;
const statusLabels=['Open','In Progress','Completed','Disputed','Cancelled'];
const statusClasses=['status-open','status-progress','status-completed','status-disputed','status-cancelled'];
function setMode(m){mode=m;document.querySelectorAll('.mode-btn').forEach((b,i)=>b.classList.toggle('active',i===(m==='demo'?0:1)));resetState()}
function resetState(){connected=false;account=null;demoJobs=[];demoBalance=50;provider=null;signer=null;contract=null;document.getElementById('walletBtn').textContent='Connect Wallet';document.getElementById('walletBtn').classList.remove('connected');document.getElementById('postBtn').disabled=true;updateStats();renderJobs()}
function showToast(msg,type='success'){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000)}
function connectWallet(){
  if(connected){resetState();return}
  if(mode==='demo'){
    account='0xDe'+Math.random().toString(16).slice(2,10)+'...'+Math.random().toString(16).slice(2,6);
    connected=true;
    document.getElementById('walletBtn').textContent=account.slice(0,8)+'...';
    document.getElementById('walletBtn').classList.add('connected');
    document.getElementById('postBtn').disabled=false;
    seedDemoJobs();updateStats();renderJobs();
    showToast('Demo wallet connected!');
  } else {
    connectLive();
  }
}
async function connectLive(){
  if(typeof window.ethereum==='undefined'){showToast('MetaMask not found. Install it or use Demo Mode.','error');return}
  try{
    try{ await window.ethereum.request({method:'wallet_switchEthereumChain',params:[{chainId:BOT_CHAIN.chainId}]}) }
    catch(err){ if(err.code===4902) await window.ethereum.request({method:'wallet_addEthereumChain',params:[BOT_CHAIN]}); else if(err.code===4001){showToast('Network switch rejected','error');return} }
    provider=new ethers.BrowserProvider(window.ethereum);
    await window.ethereum.request({method:'eth_requestAccounts'});
    signer=await provider.getSigner();
    account=await signer.getAddress();
    contract=new ethers.Contract(CONTRACT_ADDRESS,ABI,signer);
    connected=true;
    document.getElementById('walletBtn').textContent=account.slice(0,6)+'...'+account.slice(-4);
    document.getElementById('walletBtn').classList.add('connected');
    document.getElementById('postBtn').disabled=false;
    if(CONTRACT_ADDRESS==='0x0000000000000000000000000000000000000000'){showToast('Wallet connected! Deploy the contract and set CONTRACT_ADDRESS to enable on-chain actions.')}
    else{ await loadLiveJobs(); showToast('Connected to BOT Chain!') }
  }catch(e){ showToast('Connection failed: '+(e.message||e),'error') }
}
async function loadLiveJobs(){
  if(!contract||CONTRACT_ADDRESS==='0x0000000000000000000000000000000000000000')return;
  try{
    const count=await contract.getJobCount();demoJobs=[];
    for(let i=0;i<count;i++){
      const j=await contract.getJob(i);
      demoJobs.push({client:j.client,freelancer:j.freelancer,title:j.title,description:j.description,budget:parseFloat(ethers.formatEther(j.budget)).toFixed(2),status:Number(j.status),createdAt:Number(j.createdAt)*1000});
    }
    updateStats();renderJobs();
  }catch(e){ showToast('Failed to load jobs: '+e.message,'error') }
}
if(typeof window!=='undefined'&&window.ethereum){
  window.ethereum.on&&window.ethereum.on('accountsChanged',()=>{if(mode==='live')resetState()});
  window.ethereum.on&&window.ethereum.on('chainChanged',()=>{if(mode==='live')window.location.reload()});
}
function seedDemoJobs(){
  const titles=['Build DeFi Dashboard','Create NFT Marketplace UI','Smart Contract Audit','Design Landing Page','API Integration Service','Mobile App Prototype'];
  const descs=['Full-stack dashboard with charts and analytics','React-based marketplace with wallet connection','Security audit for ERC-20 token contract','Modern responsive landing page design','RESTful API integration with Web3','Cross-platform mobile app wireframes and prototype'];
  const clients=['0xAb12...3456','0xCd34...7890','0xEf56...1234'];
  for(let i=0;i<6;i++){
    const s=i<2?0:i<4?1:2;
    demoJobs.push({client:i%2===0?account:clients[i%3],freelancer:s>0?(i%2===0?clients[0]:account):null,title:titles[i],description:descs[i],budget:(Math.random()*5+0.5).toFixed(2),status:s,createdAt:Date.now()-86400000*(6-i)});
  }
}
function updateStats(){
  const total=demoJobs.length,completed=demoJobs.filter(j=>j.status===2).length;
  const locked=demoJobs.filter(j=>j.status<2).reduce((s,j)=>s+parseFloat(j.budget),0);
  document.getElementById('totalJobs').textContent=total;
  document.getElementById('completedJobs').textContent=completed;
  document.getElementById('valueLocked').textContent=locked.toFixed(2)+' BOT';
}
function renderJobs(){
  const el=document.getElementById('jobsList');
  let filtered=demoJobs;
  if(currentTab==='my-client')filtered=demoJobs.filter(j=>j.client===account);
  if(currentTab==='my-freelancer')filtered=demoJobs.filter(j=>j.freelancer===account);
  if(!connected||filtered.length===0){el.innerHTML='<div class="empty-state"><div class="icon">💼</div>'+(connected?'No jobs found in this tab':'Connect wallet to see jobs')+'</div>';return}
  el.innerHTML=filtered.map((j,i)=>{
    const idx=demoJobs.indexOf(j);
    let actions='';
    if(j.status===0&&j.client!==account)actions=`<button class="action-btn primary" onclick="acceptJob(${idx})">Accept Job</button>`;
    if(j.status===0&&j.client===account)actions=`<button class="action-btn danger" onclick="cancelJob(${idx})">Cancel</button>`;
    if(j.status===1&&j.client===account)actions=`<button class="action-btn primary" onclick="approveWork(${idx})">Approve & Pay</button><button class="action-btn danger" onclick="raiseDispute(${idx})">Dispute</button>`;
    return `<div class="job-card"><div class="job-header"><div class="job-title">${j.title}</div><div class="job-budget">${j.budget} BOT</div></div><div class="job-desc">${j.description}</div><div class="job-meta"><span class="job-status ${statusClasses[j.status]}">${statusLabels[j.status]}</span><span class="job-addr">Client: ${j.client}</span>${j.freelancer?`<span class="job-addr">Freelancer: ${j.freelancer}</span>`:''}</div>${actions?`<div class="job-actions">${actions}</div>`:''}</div>`}).join('');
}
function switchTab(tab){currentTab=tab;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));event.target.classList.add('active');renderJobs()}
async function postJob(){
  const title=document.getElementById('jobTitle').value,desc=document.getElementById('jobDesc').value,budget=document.getElementById('jobBudget').value;
  if(!title||!budget||parseFloat(budget)<=0){showToast('Fill in title and budget','error');return}
  if(mode==='live'){
    if(!contract||CONTRACT_ADDRESS==='0x0000000000000000000000000000000000000000'){showToast('Contract not deployed yet','error');return}
    try{
      showToast('Confirm in MetaMask...');
      const tx=await contract.createJob(title,desc||'No description',{value:ethers.parseEther(budget)});
      await tx.wait();
      document.getElementById('jobTitle').value='';document.getElementById('jobDesc').value='';document.getElementById('jobBudget').value='';
      await loadLiveJobs();showToast('Job posted on-chain!');
    }catch(e){showToast('Transaction failed: '+(e.reason||e.message),'error')}
    return;
  }
  demoJobs.unshift({client:account,freelancer:null,title,description:desc||'No description',budget:parseFloat(budget).toFixed(2),status:0,createdAt:Date.now()});
  demoBalance-=parseFloat(budget);updateStats();renderJobs();
  document.getElementById('jobTitle').value='';document.getElementById('jobDesc').value='';document.getElementById('jobBudget').value='';
  showToast('Job posted successfully!');
}
async function acceptJob(i){
  if(mode==='live'){
    if(!contract){showToast('Contract not deployed yet','error');return}
    try{ showToast('Confirm in MetaMask...'); const tx=await contract.acceptJob(i); await tx.wait(); await loadLiveJobs(); showToast('Job accepted on-chain!') }
    catch(e){showToast('Transaction failed: '+(e.reason||e.message),'error')}
    return;
  }
  demoJobs[i].freelancer=account;demoJobs[i].status=1;updateStats();renderJobs();showToast('Job accepted!')
}
async function approveWork(i){
  if(mode==='live'){
    if(!contract){showToast('Contract not deployed yet','error');return}
    try{ showToast('Confirm in MetaMask...'); const tx=await contract.approveWork(i); await tx.wait(); await loadLiveJobs(); showToast('Work approved — payment sent on-chain!') }
    catch(e){showToast('Transaction failed: '+(e.reason||e.message),'error')}
    return;
  }
  demoJobs[i].status=2;demoBalance+=parseFloat(demoJobs[i].budget)*0.975;updateStats();renderJobs();showToast('Work approved — payment sent!')
}
async function cancelJob(i){
  if(mode==='live'){
    if(!contract){showToast('Contract not deployed yet','error');return}
    try{ showToast('Confirm in MetaMask...'); const tx=await contract.cancelJob(i); await tx.wait(); await loadLiveJobs(); showToast('Job cancelled on-chain — refunded') }
    catch(e){showToast('Transaction failed: '+(e.reason||e.message),'error')}
    return;
  }
  demoJobs[i].status=4;demoBalance+=parseFloat(demoJobs[i].budget);updateStats();renderJobs();showToast('Job cancelled — refunded')
}
async function raiseDispute(i){
  if(mode==='live'){
    if(!contract){showToast('Contract not deployed yet','error');return}
    try{ showToast('Confirm in MetaMask...'); const tx=await contract.raiseDispute(i); await tx.wait(); await loadLiveJobs(); showToast('Dispute raised on-chain','error') }
    catch(e){showToast('Transaction failed: '+(e.reason||e.message),'error')}
    return;
  }
  demoJobs[i].status=3;updateStats();renderJobs();showToast('Dispute raised','error')
}
</script>
</body>
</html>
